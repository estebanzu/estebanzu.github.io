    Experience:
      - company: Wind River Systems
        position: Sr. Manager Professional Services
        location: San José, Costa Rica
        start_date: Dec 2022
        end_date: Present
        summary: Lead a 22-person global team (12 direct, 10 matrix across US, Costa Rica, and EMEA) supporting Tier 2 and Tier 3 Aerospace & Defense and Industrial customers.
        highlights:
          - "Maintain 100% SLA and cut delivery time by 25% with streamlined SOWs and shared resourcing for a multi-million dollar North America portfolio."
          - "Direct day-to-day security engineering: CVE remediation, SBOM generation, and CRA readiness across hardened VxWorks, RTOS, and legacy Linux fleets operating 24x7."
          - "Oversee strategic long-term maintenance for RTOS and legacy Linux releases to enable high-availability patching without downtime."
          - "Implemented a scalable delivery model driving a 25% efficiency gain and 5% North America services revenue growth with higher billable utilization."
          - "Partner with delivery directors, VPs, and product/program managers to architect VxWorks Managed Services and embed CRA compliance into client workflows."
          - "Scaled the Costa Rica Professional Services organization from 0 to 25 engineers with <3% annual attrition via hands-on mentoring and structured growth paths."

      - company: Wind River Systems
        position: Site Lead & Sr. Manager Operations
        location: San José, Costa Rica
        start_date: Feb 2022
        end_date: Nov 2022
        summary: Local leader for the Customer Experience Organization in Costa Rica, overseeing Customer Support, Professional Services, and site operations.
        highlights:
          - "Scaled the Costa Rica site from 5 to 213 employees across R&D, Support, HR, and Professional Services; established hiring pipelines, onboarding, and OKRs."
          - "Site expanded to handle ~40% of global support volume."
          - "Leveraged Salesforce and CRM analytics to identify at-risk accounts, boosting customer retention by 20% in Industrial and A&D sectors."
          - "Built an engineering internship program from scratch achieving 95% full-time conversion (40+ engineers hired)."
          - "Served as technical liaison for university and industry partnerships since 2017; facilitated software license donations and student mentoring programs."
          - "Spearheaded local and global innovation forums facilitating cross-organizational knowledge sharing and prototype incubation."

      - company: Wind River Systems
        position: Site Lead & Manager Technical Support
        location: San José, Costa Rica
        start_date: May 2018
        end_date: 2021
        summary: Reported to Global Sr. Director for Customer Support, directing North American Linux technical support and local site operations.
        highlights:
          - "Co-led Support SCP certification (2019–2022, Service Strategies), harmonizing 12 SOPs across APAC, EMEA, and North America, reducing cross-regional handoffs by ~30%."
          - "Managed a team of 10+ engineers supporting global embedded Linux deployments while sustaining 98% CSAT."
          - "Represented Customer Success in TSIA benchmarking, driving support automation and workflow optimization."
          - "Partnered with Wind River VP to execute new Costa Rica office build-out; transitioned 200+ employees on budget and schedule, recognized in 2019 by CEO and Executive VP."

      - company: Wind River Systems (Intel)
        position: Sr. Embedded Software Engineer
        location: San José, Costa Rica
        start_date: Jan 2017
        end_date: May 2018
        summary: Technical lead for Tier 2 global customers on Embedded Linux, Yocto Project, and Wind River Linux.
        highlights:
          - "Architected custom IoT and embedded solutions across Intel, ARM, PowerPC, and MIPS architectures."
          - "Bridged engineering and customer success by aligning technical roadmaps directly with client operational requirements."

      - company: Intel Corporation
        position: Sr. Mixed-Signal Validation Engineer
        location: San José, Costa Rica
