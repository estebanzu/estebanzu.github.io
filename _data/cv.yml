        highlights:
          - "Executed pre- and post-silicon validation for complex mixed-signal SoCs alongside global design teams."
          - "Formulated comprehensive verification test plans and cross-site testing protocols to ensure hardware deadline adherence."

      - company: Inband Software S.R.L.
        position: Lead DSP Engineer
        location: San José, Costa Rica
        start_date: Jan 2011
        end_date: Oct 2015
        summary: Directed a team of 10+ engineers translating signal processing algorithms into high-performance C implementations on DPUs.
        highlights:
          - "Optimized DPU software execution from MATLAB mathematical models to highly efficient embedded C."
          - "Enhanced RTOS networking stacks to achieve low latency in demanding telecommunication environments."
          - "Managed full software lifecycles and resolved complex technical escalations."

